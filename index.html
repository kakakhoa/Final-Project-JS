<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Photo Gallery</h1>
        <section class="featured" id="featured" aria-live="polite" aria-label="Selected image">
            <p id="caption">Hover mouse to view image</p>
        </section>
        <div class="gallery" aria-label="Choose a photo">
            <button type="button" aria-pressed="true" data-image="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=85" data-alt="Mountain lake at sunrise">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=500&q=80" alt="Mountain lake at sunrise">
            </button>
            <button type="button" aria-pressed="false" data-image="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85" data-alt="Quiet alpine lake surrounded by mountains">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=500&q=80" alt="Quiet alpine lake surrounded by mountains">
            </button>
            <button type="button" aria-pressed="false" data-image="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85" data-alt="Golden sunlight over a wide landscape">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=500&q=80" alt="Golden sunlight over a wide landscape">
            </button>
            <button type="button" aria-pressed="false" data-image="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85" data-alt="Sunlight filtering through a green forest">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=500&q=80" alt="Sunlight filtering through a green forest">
            </button>
            <button type="button" aria-pressed="false" data-image="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1600&q=85" data-alt="Ocean waves rolling onto the shore">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=500&q=80" alt="Ocean waves rolling onto the shore">
            </button>
            <button type="button" aria-pressed="false" data-image="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85" data-alt="Dramatic mountains beneath a cloudy sky">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=500&q=80" alt="Dramatic mountains beneath a cloudy sky">
            </button>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
